    <!-- Silence benign Vite development HMR WebSocket notices in AI Studio preview iframe -->
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).join(' ');
          if (text.indexOf('WebSocket closed without opened') !== -1 ||
              text.indexOf('WebSocket') !== -1 ||
              text.indexOf('[vite]') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };

        // Intercept native WebSocket to silently handle HMR disconnects
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var ws = protocols ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            try {
              ws.addEventListener('error', function(err) {
                if (err && typeof err.stopImmediatePropagation === 'function') {
                  err.stopImmediatePropagation();
                }
              }, true);
            } catch (e) {}
            return ws;
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
        }

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          var filename = (e && e.filename) ? e.filename : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || filename.indexOf('@vite/client') !== -1) {
            if (e && typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
            if (e && typeof e.preventDefault === 'function') {
              e.preventDefault();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('[vite]') !== -1) {
            if (e && typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
            if (e && typeof e.preventDefault === 'function') {
              e.preventDefault();
            }
            return true;
          }
        }, true);
      })();
    </script>
