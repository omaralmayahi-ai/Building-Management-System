version: '3.8'

services:
  # ====================================================================
  # Midland Oil Company Assets Management System - Web & API Service
  # ====================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midland_oil_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      # يجب ضبط DATABASE_URL في ملف .env قبل التشغيل
      - DATABASE_URL=${DATABASE_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      # مسار مفتاح Firestore (اختياري)
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    volumes:
      # بيانات الملفات المرفقة (تُحفظ خارج الحاوية)
      - bms_files:/app/.data/files
      # ملف مفتاح Firestore إن وُجد (اختياري — يُمرَّر من المضيف)
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-/dev/null}:${FIREBASE_SERVICE_ACCOUNT_PATH:-/dev/null}:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - midland_network

  # ====================================================================
  # Central PostgreSQL 16 Database Service
  # الترحيلات تُدار بالكود (MIGRATIONS في server.ts) — لا حاجة لـ init.sql
  # ====================================================================
  db:
    image: postgres:16-alpine
    container_name: midland_oil_postgres
    restart: unless-stopped
    environment:
      # يجب ضبط هذه القيم في ملف .env قبل التشغيل
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - midland_network

networks:
  midland_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  bms_files:
    driver: local
