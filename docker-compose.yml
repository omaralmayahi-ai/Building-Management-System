version: '3.8'

services:
  # ====================================================================
  # Midland Oil Company Assets Management System - Web & API Service
  # ====================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midland_oil_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - DATABASE_URL=${DATABASE_URL:-postgres://oil_user:OilCompany2026_SecureKey@db:5432/midland_assets_db}
      - API_SECRET_KEY=${API_SECRET_KEY:-midland_oil_secure_api_key_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - midland_network

  # ====================================================================
  # Central PostgreSQL 16 Database Service
  # ====================================================================
  db:
    image: postgres:16-alpine
    container_name: midland_oil_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-oil_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-OilCompany2026_SecureKey}
      - POSTGRES_DB=${POSTGRES_DB:-midland_assets_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oil_user} -d ${POSTGRES_DB:-midland_assets_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - midland_network

networks:
  midland_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
